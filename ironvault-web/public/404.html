<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IronVault - Page Not Found</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #111113;
      --text: #ffffff;
      --muted: #d1d1d6;
      --subtle: #8e8e93;
      --border: #2c2c2e;
      --accent: #32d74b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }

    section {
      width: min(460px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      text-align: center;
    }

    .mark {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #001405;
      font-weight: 900;
      font-size: 24px;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 28px;
    }

    p {
      margin: 0 0 20px;
      color: var(--subtle);
      line-height: 1.55;
    }

    a {
      display: inline-block;
      color: #001405;
      background: var(--accent);
      border-radius: 999px;
      padding: 11px 16px;
      text-decoration: none;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <section>
    <div class="mark">IV</div>
    <h1>Page Not Found</h1>
    <p>The page you opened is not available. You can return to IronVault support, privacy, and terms information.</p>
    <a href="/">Go to IronVault Support</a>
  </section>
</body>
</html>
